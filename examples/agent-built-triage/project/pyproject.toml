[project]
name = "triage"
version = "0.1.0"
description = "Triage customer messages with Jev: routing, refund intent, and urgency"
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk==0.7.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.workspace]
members = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
